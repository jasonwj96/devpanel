server:
  port: ${SERVER_PORT}

spring:
  application:
    name: devpanel-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' keeps setup friction-free for the exam/local dev.
      # In a real environment this would be 'validate' + Flyway/Liquibase migrations.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

devpanel:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed:
    enabled: ${SEED_ENABLED}

logging:
  level:
    com.credicorp.devpanel: INFO